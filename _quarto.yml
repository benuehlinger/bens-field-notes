project:
  type: website
  output-dir: _site
  pre-render:
    - python3 scripts/build-knowledge.py
  render:
    - index.qmd
    - about.qmd
    - ai-engineering/**/*.qmd
  resources:
    - assets/**
    - content/**

website:
  title: "Ben's Field Notes"
  description: "A working journal of questions, experiments, and AI systems I want to understand."
  site-url: https://bensnotes.fyi
  navbar:
    title: "Ben's Field Notes"
    left:
      - text: AI engineering
        href: ai-engineering/index.qmd
      - text: Investigations
        href: ai-engineering/investigations/smolagents-and-langgraph.qmd
      - text: Sources
        href: ai-engineering/library.qmd
    right:
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/benuehlinger/bens-field-notes
        aria-label: Source repository
  page-footer:
    left: "Ben's Field Notes · A working understanding."
    right:
      - text: Built with Quarto
        href: https://quarto.org
      - text: Source & history
        href: https://github.com/benuehlinger/bens-field-notes
  search:
    location: navbar
    type: overlay
  open-graph: true

format:
  html:
    theme:
      dark: [darkly, styles/theme.scss]
      light: [flatly, styles/theme.scss]
    css: styles/custom.css
    toc: false
    toc-depth: 2
    code-fold: true
    code-tools: false
    highlight-style: github
    fig-responsive: true
    include-after-body:
      - text: '<script src="/assets/knowledge.js" defer></script>'
    grid:
      sidebar-width: 0px
      body-width: 1180px
      margin-width: 180px

execute:
  freeze: auto
