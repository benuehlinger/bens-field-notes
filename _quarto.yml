project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "posts/**/*.ipynb"
  resources:
    - "styles/**"

website:
  title: "Ben's Field Notes"
  description: "Rigorous Analysis. Questionable Conclusions. Overengineered Charts."

  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Notes"
        href: posts/index.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/benuehlinger/bens-field-notes
        aria-label: GitHub

  page-footer:
    left: |
      Ben's Field Notes — Rigorous Analysis. Questionable Conclusions.
    right: |
      Built with [Quarto](https://quarto.org). [Data & methods](/data-sources.qmd).

  search: true

  open-graph:
    title: "Ben's Field Notes"
    description: "Rigorous Analysis. Questionable Conclusions. Overengineered Charts."

format:
  html:
    theme:
      light: [flatly, styles/theme.scss]
      dark: [darkly, styles/theme.scss]
    css: styles/custom.css
    toc: false
    toc-depth: 3
    code-fold: true
    code-tools: false
    highlight-style: github-dark
    fig-responsive: true
    grid:
      sidebar-width: 0px
      body-width: 1056px
      margin-width: 253px

execute:
  freeze: auto
  cache: false

params:
  r2-base-url: ""
